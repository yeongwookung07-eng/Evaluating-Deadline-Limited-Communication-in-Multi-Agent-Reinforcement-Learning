question: Are nonzero rewards present in saved training replay, and why do random versus initial greedy rollouts end?
hypothesis: Reward access and early group failure differ between uniform random and frozen initial greedy behavior.
strongest_control: Paired environment seeds, same initial model seed and cyclic five-gate schedule; unchanged rollout and Hallway sources.
competing_explanation: Timeouts may follow one failed group or the simultaneous-group penalty; a timeout alone does not identify exploration failure.
falsification: Do not claim historical replay contents when buffers are absent; separate terminal causes from nonterminal events.
source_config: experiments/deadline_comm/configs/timing_rank.yaml
historical_runs: [preliminary_train_seed0, preliminary_train_seed1, preliminary_train_seed2]
arms:
  random: 1.0
  initial_greedy: 0.0
episodes_per_arm: 1000
environment_seed_start: 810000
model_seeds: [0, 1, 2]
max_steps: 28000
output_name: exploration_reward_audit_001
